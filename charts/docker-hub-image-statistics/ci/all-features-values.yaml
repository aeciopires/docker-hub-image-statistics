# Used by "make helm-validate" to render every optional feature.
dockerhub:
  username: example
  token: dckr_pat_example
ingress:
  enabled: true
  className: nginx
  tls:
    - hosts: [dhis.example.com]
      secretName: dhis-tls
httpRoute:
  enabled: true
serviceMonitor:
  enabled: true
grafanaDashboards:
  enabled: true
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4318
          protocol: TCP
config:
  telemetry:
    otlp_endpoint: http://otel-collector.observability:4318
    traces: true
    logs: true
extraEnv:
  - name: DHIS_LOG_LEVEL
    value: "{{ .Values.config.log.level }}"
extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: ReferenceGrant
    metadata:
      name: "{{ include \"dhis.fullname\" . }}-from-gateway"
    spec:
      from:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: gateway-system
      to:
        - group: ""
          kind: Service
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ include "dhis.fullname" . }}-extra
    data:
      release: {{ .Release.Name | quote }}
