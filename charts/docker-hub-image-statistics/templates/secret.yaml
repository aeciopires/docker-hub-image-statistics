{{- if and .Values.dockerhub.token (not .Values.dockerhub.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dhis.secretName" . }}
  labels:
    {{- include "dhis.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ required "dockerhub.username is required when dockerhub.token is set" .Values.dockerhub.username | b64enc | quote }}
  token: {{ .Values.dockerhub.token | b64enc | quote }}
{{- end }}
