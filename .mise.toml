# Development toolchain managed by mise (https://mise.jdx.dev).
# Install everything with: make install-deps   (or: mise install)
# Docker and Docker Compose are installed separately (see REQUIREMENTS.md).

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
trivy = "0.76.2"
helm = "4.3.2"
helm-docs = "1.14.2"
kubeconform = "0.8.0"
hadolint = "2.15.1"
kind = "0.33.0"
kubectl = "1.37.2"

[settings]
# Fail early instead of silently using another version.
not_found_auto_install = true
