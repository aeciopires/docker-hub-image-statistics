# Example configuration. Copy it to config.yaml (ignored by git) and adjust.
# Precedence: built-in defaults < this file < DHIS_* environment variables < flags.
# Every option is described in docs/configuration.md.

server:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 15s

log:
  level: info        # debug | info | warn | error
  format: json       # json | text

dockerhub:
  base_url: https://hub.docker.com
  # Users or organizations whose public images are discovered automatically.
  namespaces:
    - library
  # Explicit images: "namespace/name", or "name" for official images.
  repositories:
    - grafana/grafana
  # Glob filters applied to "namespace/name".
  include: []
  exclude:
    - "*/*-dev"
  # Optional credentials (raise the API limits). Prefer the environment
  # variables DHIS_DOCKERHUB_USERNAME / DHIS_DOCKERHUB_TOKEN.
  username: ""
  token: ""
  timeout: 30s
  page_size: 100
  max_retries: 3
  # 0 = automatic (60 anonymous / 150 authenticated). Anonymous max: 180.
  requests_per_minute: 0

collector:
  interval: 1h       # minimum 5m anonymous, 1m authenticated
  run_on_start: true

cache:                # read order: sqlite -> disk -> memory
  sqlite:
    enabled: true
    path: data/statistics.db
  disk:
    enabled: true
    path: data/statistics.json
  memory:
    enabled: true
  retention: 2160h   # 90 days (minimum 744h)

telemetry:
  service_name: docker-hub-image-statistics
  otlp_endpoint: ""  # e.g. http://localhost:4318
  traces: false
  logs: false
  sample_ratio: 1
