global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: docker-hub-image-statistics
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
